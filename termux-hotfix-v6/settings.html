<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"/><meta name="theme-color" content="#202225"/><link rel="manifest" href="/manifest.webmanifest"/><title>Eburon Translator - Settings</title>
<style>
:root{--bg:#202225;--input:#0c0d0e;--input-border:#35383d;--label:#8b929d;--white:#fff;--blue:#1f93ff;--blue-text:#081a2f;--divider:#2e3238;--history:#7c838f}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}html,body{width:100%;min-height:100%;background:#121315}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100dvh;display:flex;justify-content:center;color:var(--white)}
.app-viewport{width:100%;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column;padding:max(env(safe-area-inset-top),18px) clamp(22px,5vw,38px) max(env(safe-area-inset-bottom),24px);overflow-y:auto}
.header{display:flex;justify-content:space-between;align-items:center;padding:10px 0 20px;border-bottom:1px solid var(--divider)}.header-title{font-size:clamp(26px,7vw,36px);font-weight:500}.close-btn{background:none;border:0;color:#fff;padding:6px;display:flex}
.form-content{display:flex;flex-direction:column;gap:22px;padding-top:28px;flex:1}.form-group{display:flex;flex-direction:column;gap:10px}.form-label{font-size:clamp(16px,4.5vw,20px);color:var(--label)}
.select-box{position:relative;width:100%}.custom-select{width:100%;height:58px;background:var(--input);border:1px solid #5a5f66;border-radius:12px;padding:0 44px 0 16px;color:#fff;font-size:17px;appearance:none;-webkit-appearance:none;outline:none}.custom-select:focus{border-color:var(--blue)}.select-arrow{position:absolute;right:16px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--label)}
.checkbox-row{display:flex;align-items:center;gap:14px;cursor:pointer}.custom-checkbox{width:24px;height:24px;border-radius:4px;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid #6b7178;flex-shrink:0}.custom-checkbox.checked{background:var(--blue);border-color:var(--blue)}.checkbox-icon{display:none;width:15px;height:15px;stroke:#fff;stroke-width:3.2}.custom-checkbox.checked .checkbox-icon{display:block}.checkbox-text{font-size:17px;color:#e5e7eb}
.section-title,.history-title{font-size:14px;font-weight:700;color:var(--history);text-transform:uppercase;letter-spacing:.8px}.mode-options{display:flex;flex-direction:column;gap:16px}
.save-btn{width:100%;height:58px;background:var(--blue);color:var(--blue-text);font-size:18px;font-weight:600;border:0;border-radius:12px;margin-top:8px}.save-btn:active{transform:scale(.99)}
.divider{height:1px;background:var(--divider);margin:14px 0}.history-header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:12px}.history-actions{display:flex;align-items:center;gap:18px}.history-action-btn{background:none;border:0;color:#656d79;font-size:14px;display:flex;align-items:center;gap:5px}.history-list{display:flex;flex-direction:column;gap:8px;padding:6px 0 20px}.history-item{padding:10px 12px;border:1px solid var(--divider);border-radius:10px;color:#c5cad0;font-size:14px}
.device-box{border:1px solid var(--divider);border-radius:12px;padding:14px 16px;color:#8b929d;font-size:13px;line-height:1.7}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--blue);color:var(--blue-text);padding:10px 20px;border-radius:30px;font-weight:600;opacity:0;transition:.25s;pointer-events:none}.toast.show{transform:translateX(-50%);opacity:1}
@media(min-width:768px){.app-viewport{max-width:none;padding-left:clamp(40px,9vw,120px);padding-right:clamp(40px,9vw,120px)}.custom-select,.save-btn{height:64px}.form-content{gap:26px}}
</style></head><body><div class="app-viewport">
<header class="header"><h1 class="header-title">Settings</h1><a href="/" class="close-btn" aria-label="Close"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></a></header>
<div class="form-content">
<div class="form-group"><label class="form-label" for="staffLang">Staff Language (Language 1)</label><div class="select-box"><select id="staffLang" class="custom-select"><option value="nl-BE">Dutch (Flemish)</option><option value="en-US">English (US)</option><option value="fr-FR">French</option><option value="de-DE">German</option><option value="es-ES">Spanish</option><option value="it-IT">Italian</option><option value="pt-PT">Portuguese</option><option value="pl-PL">Polish</option></select><svg class="select-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg></div></div>
<div class="form-group"><label class="form-label" for="guestLang">Guest Language (Language 2)</label><div class="select-box"><select id="guestLang" class="custom-select"><option value="en-US">English (US)</option><option value="nl-BE">Dutch (Flemish)</option><option value="fr-FR">French</option><option value="de-DE">German</option><option value="es-ES">Spanish</option><option value="it-IT">Italian</option><option value="zh-CN">Chinese</option><option value="ar-SA">Arabic</option><option value="tl-PH">Filipino</option><option value="id-ID">Indonesian</option></select><svg class="select-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg></div></div>
<div class="checkbox-row" id="autoRow"><div class="custom-checkbox checked" id="autoCb"><svg class="checkbox-icon" viewBox="0 0 24 24" fill="none"><polyline points="20 6 9 17 4 12"/></svg></div><span class="checkbox-text">Auto-detect Guest Language</span></div>
<div class="form-group"><label class="form-label" for="voice">AI Voice</label><div class="select-box"><select id="voice" class="custom-select"><option value="M1">Ruthenium</option><option value="M2">Titanium</option><option value="M3">Platinum</option><option value="M4">Cobalt</option><option value="F1">Iridium</option><option value="F2">Palladium</option></select><svg class="select-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg></div></div>
<div class="form-group"><span class="section-title">Translation Mode</span><div class="mode-options"><div class="checkbox-row" data-mode="medical"><div class="custom-checkbox checked" id="medicalCb"><svg class="checkbox-icon" viewBox="0 0 24 24" fill="none"><polyline points="20 6 9 17 4 12"/></svg></div><span class="checkbox-text">Medical Terms</span></div><div class="checkbox-row" data-mode="general"><div class="custom-checkbox" id="generalCb"><svg class="checkbox-icon" viewBox="0 0 24 24" fill="none"><polyline points="20 6 9 17 4 12"/></svg></div><span class="checkbox-text">General</span></div></div></div>
<button class="save-btn" id="saveBtn">Save Settings</button>
<div class="divider"></div>
<div class="history-header"><span class="history-title">Translation History</span><div class="history-actions"><button class="history-action-btn" id="exportBtn">⇩ Export</button><button class="history-action-btn" id="clearBtn">⌫ Clear</button></div></div><div class="history-list" id="historyList"></div>
<div class="device-box" id="deviceBox">Local AI · checking…<br>Gateway · 127.0.0.1:8850<br>Runtime · offline local</div>
</div></div><div class="toast" id="toast">Settings Saved</div>
<script>
const saved=JSON.parse(localStorage.getItem('eburonSettings')||'{}');let auto=saved.autoDetect!==false,mode=saved.mode||'medical';
const $=id=>document.getElementById(id);$('staffLang').value=saved.staffLang||'nl-BE';$('guestLang').value=saved.guestLang||'en-US';$('voice').value=saved.voice||'M1';
function paint(){ $('autoCb').classList.toggle('checked',auto);$('medicalCb').classList.toggle('checked',mode==='medical');$('generalCb').classList.toggle('checked',mode==='general') } paint();
$('autoRow').onclick=()=>{auto=!auto;paint()};document.querySelectorAll('[data-mode]').forEach(el=>el.onclick=()=>{mode=el.dataset.mode;paint()});
$('saveBtn').onclick=()=>{localStorage.setItem('eburonSettings',JSON.stringify({staffLang:$('staffLang').value,guestLang:$('guestLang').value,autoDetect:auto,voice:$('voice').value,mode}));$('toast').classList.add('show');setTimeout(()=>location.href='/',650)};
function renderHistory(){const h=JSON.parse(localStorage.getItem('eburonHistory')||'[]');$('historyList').innerHTML=h.length?h.slice(0,20).map(x=>'<div class="history-item">'+new Date(x.time).toLocaleString()+' · '+String(x.text).replace(/[<>&]/g,s=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[s]))+'</div>').join(''):'<div class="history-item">No translation history yet.</div>'} renderHistory();
$('clearBtn').onclick=()=>{localStorage.removeItem('eburonHistory');renderHistory()};
$('exportBtn').onclick=()=>{const data=localStorage.getItem('eburonHistory')||'[]',blob=new Blob([data],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='eburon-translation-history.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
fetch('/health',{cache:'no-store'}).then(r=>r.json()).then(h=>$('deviceBox').innerHTML='Local AI · '+(h.offline_ready?'ready':'starting')+'<br>Gateway · 127.0.0.1:8850<br>Runtime · '+(h.offline_ready?'offline ready':'initializing')).catch(()=>$('deviceBox').innerHTML='Local AI · unavailable<br>Gateway · 127.0.0.1:8850<br>Runtime · check Termux');
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/service-worker.js').catch(()=>{}));
</script></body></html>
