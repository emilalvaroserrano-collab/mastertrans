<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#1e1f21"/><link rel="manifest" href="/manifest.webmanifest"/>
<title>Eburon Translator - Streaming</title>
<style>
:root{--bg:#1e1f21;--border:rgba(255,255,255,.16);--idle:#282d30;--muted:#8b929a;--orange:#ff4513;--navy:#0f2a4a;--blue:#298df8}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}html,body{width:100%;height:100%;background:#121315}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100dvh;display:flex;justify-content:center;align-items:center;color:#fff;overflow:hidden}
.app-viewport{width:100%;height:100dvh;background:var(--bg);display:flex;flex-direction:column;justify-content:space-between;position:relative;padding:max(env(safe-area-inset-top),20px) clamp(18px,4vw,28px) max(env(safe-area-inset-bottom),22px);overflow:hidden}
.top-bar{display:flex;justify-content:flex-end;width:100%;padding-top:8px}.tune-btn{background:none;border:0;color:#fff;padding:8px;display:flex}.main-canvas{flex:1}
.bottom-section{width:100%;display:flex;flex-direction:column;align-items:center;padding-bottom:clamp(8px,3vh,22px)}
.visualizer-container{display:flex;align-items:center;justify-content:center;gap:4px;margin-bottom:18px;height:18px;max-width:100%;overflow:hidden}
.dot{width:5px;height:7px;background:var(--orange);border-radius:3px;animation:pulseWave 1.1s ease-in-out infinite alternate}
@keyframes pulseWave{0%{height:5px;opacity:.65;transform:scaleY(.7)}50%{height:13px;opacity:1;transform:scaleY(1.3)}100%{height:6px;opacity:.8;transform:scaleY(.85)}}
.action-bar{display:flex;align-items:flex-start;justify-content:center;gap:14px;width:100%}.pill-container{display:flex;align-items:center;background:rgba(22,23,25,.6);border:1.5px solid var(--border);border-radius:42px;padding:6px 8px;gap:8px}
.control-btn{width:clamp(62px,17vw,74px);height:clamp(62px,17vw,74px);max-width:74px;max-height:74px;border-radius:24px;border:0;background:var(--idle);color:var(--muted);display:flex;align-items:center;justify-content:center}.control-btn.active-mic{background:var(--orange);color:#111;box-shadow:0 4px 18px rgba(255,69,19,.4)}.control-btn:active{transform:scale(.94)}
.pause-wrapper-col{display:flex;flex-direction:column;align-items:center;gap:8px}.pause-wrapper{width:82px;height:82px;display:flex;align-items:center;justify-content:center;border-radius:32px;border:1.5px solid var(--border);background:rgba(22,23,25,.6)}
.pause-btn-inner{width:68px;height:68px;border-radius:24px;background:var(--navy);border:2px solid var(--blue);display:flex;align-items:center;justify-content:center}.pause-btn-inner:active{transform:scale(.92)}.pause-icon-box{display:flex;gap:6px}.pause-bar{width:6px;height:20px;border:2.2px solid var(--blue);border-radius:2px}.streaming-text{color:var(--blue);font-size:14px;font-weight:500}.icon-svg{width:28px;height:28px;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.status-toast{position:absolute;top:max(env(safe-area-inset-top),18px);left:50%;transform:translateX(-50%);font-size:12px;color:#8b929a;opacity:0;transition:.2s}.status-toast.show{opacity:1}
@media(min-width:768px){.app-viewport{max-width:none;padding-left:clamp(32px,8vw,100px);padding-right:clamp(32px,8vw,100px)}.bottom-section{padding-bottom:clamp(20px,6vh,64px)}}
@media(max-width:380px){.action-bar{gap:8px}.pill-container{gap:5px;padding:5px 6px}.control-btn{width:58px;height:58px}.pause-wrapper{width:74px;height:74px}.pause-btn-inner{width:62px;height:62px}}
</style></head>
<body><div class="app-viewport">
<div class="status-toast" id="statusToast">Connecting local AI…</div>
<header class="top-bar"><a href="/settings.html" class="tune-btn" aria-label="Open Settings"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="4" y1="6" x2="16" y2="6" stroke-width="2.5"/><circle cx="16" cy="6" r="3" fill="#fff" stroke="#1e1f21" stroke-width="2"/><line x1="8" y1="12" x2="20" y2="12" stroke-width="2.5"/><circle cx="8" cy="12" r="3" fill="#fff" stroke="#1e1f21" stroke-width="2"/><line x1="4" y1="18" x2="14" y2="18" stroke-width="2.5"/><circle cx="14" cy="18" r="3" fill="#fff" stroke="#1e1f21" stroke-width="2"/></svg></a></header>
<main class="main-canvas"></main>
<footer class="bottom-section"><div class="visualizer-container" id="visualizer"></div><div class="action-bar">
<div class="pill-container">
<button class="control-btn active-mic" id="micBtn"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="18" x2="12" y2="22"/></svg></button>
<button class="control-btn" id="speakerBtn"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg></button>
<button class="control-btn" id="resetBtn"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21.5 2v6h-6"/><path d="M21.34 15.57a9 9 0 1 1-2.4-9.36L21.5 8"/></svg></button>
</div><div class="pause-wrapper-col"><div class="pause-wrapper"><button class="pause-btn-inner" id="pauseBtn"><div class="pause-icon-box"><div class="pause-bar"></div><div class="pause-bar"></div></div></button></div><span class="streaming-text">Streaming</span></div>
</div></footer></div>
<script>
const viz=document.getElementById('visualizer');for(let i=0;i<32;i++){const d=document.createElement('div');d.className='dot';d.style.animationDelay=((Math.sin((i/32)*Math.PI)*.6)).toFixed(2)+'s';d.style.animationDuration=(.7+((i*37)%50)/100).toFixed(2)+'s';viz.appendChild(d)}
let micActive=true,speakerActive=localStorage.getItem('eburonSpeaker')!=='off',ws,recorder,stream;
const micBtn=document.getElementById('micBtn'),speakerBtn=document.getElementById('speakerBtn'),toast=document.getElementById('statusToast');
const settings=JSON.parse(localStorage.getItem('eburonSettings')||'{}');
function sync(){micBtn.classList.toggle('active-mic',micActive);viz.style.opacity=micActive?'1':'.18';speakerBtn.style.color=speakerActive?'#8b929a':'#555b62'}
sync();
function showStatus(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)}
async function connect(){
  try{
    ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws/live');
    ws.binaryType='arraybuffer';
    ws.onopen=()=>{ws.send(JSON.stringify({type:'configure',source_language:settings.staffLang||'nl-BE',target_language:settings.guestLang||'en-US',voice:settings.voice||'M1',mode:settings.mode||'medical'}));showStatus('Local AI connected')};
    ws.onmessage=e=>{if(typeof e.data==='string'){try{const m=JSON.parse(e.data);if(m.type==='translation_final'){const h=JSON.parse(localStorage.getItem('eburonHistory')||'[]');h.unshift({time:Date.now(),text:m.text});localStorage.setItem('eburonHistory',JSON.stringify(h.slice(0,200)))}}catch(_){}}};
    stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
    recorder=new MediaRecorder(stream,{mimeType:MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':''});
    recorder.ondataavailable=e=>{if(e.data.size&&ws?.readyState===1&&micActive) e.data.arrayBuffer().then(b=>ws.send(b))};
    recorder.start(400);
  }catch(e){showStatus('Microphone or local AI unavailable')}
}
micBtn.onclick=()=>{micActive=!micActive;sync()};
speakerBtn.onclick=()=>{speakerActive=!speakerActive;localStorage.setItem('eburonSpeaker',speakerActive?'on':'off');sync()};
document.getElementById('resetBtn').onclick=()=>{if(ws?.readyState===1)ws.send(JSON.stringify({type:'clear'}));localStorage.removeItem('eburonHistory')};
document.getElementById('pauseBtn').onclick=()=>{try{recorder?.stop();stream?.getTracks().forEach(t=>t.stop());ws?.close()}catch(_){}location.href='/'};
connect();
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/service-worker.js').catch(()=>{}));
</script></body></html>
